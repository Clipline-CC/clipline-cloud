name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Install media test tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Test workspace
        run: cargo test --workspace --locked

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        run: cargo audit

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install web deps
        run: npm ci --prefix apps/clipline-cloud-web
      - name: Run web tests
        run: npm test --prefix apps/clipline-cloud-web
      - name: Audit web dependencies
        run: npm audit --prefix apps/clipline-cloud-web --audit-level=high
      - name: Check committed dist
        run: npm run check:dist --prefix apps/clipline-cloud-web

  compose-config:
    name: Compose Configs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate Compose profiles
        run: CONFIG_ONLY=1 BUILD_IMAGE=0 deploy/compose/smoke.sh
      - name: Verify standalone image matches the server version
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' apps/clipline-cloud-server/Cargo.toml | head -n 1)"
          test -n "$version"
          grep -F "ghcr.io/clipline-cc/clipline-cloud:$version" deploy/compose/docker-compose.standalone.yml
          grep -F "ghcr.io/clipline-cc/clipline-cloud:$version" deploy/compose/standalone.env.example

  compose-runtime:
    name: Compose Runtime Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Exercise local, MinIO, and Postgres profiles
        run: RUN_PROFILES="default minio postgres" deploy/compose/smoke.sh

  s3-storage:
    name: S3 Storage Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Build MinIO test images from pinned source
        run: |
          docker build --target minio -t clipline-minio:local deploy/compose/minio
          docker build --target mc -t clipline-minio-mc:local deploy/compose/minio
      - name: Start MinIO
        run: |
          docker run -d --name clipline-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=clipline \
            -e MINIO_ROOT_PASSWORD=clipline-secret \
            clipline-minio:local server /data
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9000/minio/health/ready && break
            if [ "$attempt" = 30 ]; then docker logs clipline-minio; exit 1; fi
            sleep 2
          done
      - name: Create test bucket
        run: |
          docker run --rm --network host --entrypoint /bin/sh clipline-minio-mc:local \
            -c 'mc alias set local http://127.0.0.1:9000 clipline clipline-secret && mc mb local/clipline-test'
      - name: Run S3 round-trip test
        env:
          CLIPLINE_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          CLIPLINE_TEST_S3_BUCKET: clipline-test
          CLIPLINE_TEST_S3_ACCESS_KEY_ID: clipline
          CLIPLINE_TEST_S3_SECRET_ACCESS_KEY: clipline-secret
        run: cargo test --locked -p clipline-cloud-storage s3_round_trip_against_minio -- --ignored

  database-backends:
    name: Database Backends
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_USER: clipline
          POSTGRES_PASSWORD: clipline
          POSTGRES_DB: clipline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clipline -d clipline_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CLIPLINE_TEST_POSTGRES_URL: postgres://clipline:clipline@localhost:5432/clipline_test
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Test SQLite and Postgres repositories
        run: cargo test --locked -p clipline-cloud-db
