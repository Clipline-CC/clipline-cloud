name: clipline-cloud-minio

services:
  clipline-secrets:
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    restart: "no"
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        umask 077
        random_secret() {
          head -c 32 /dev/urandom | base64
        }
        random_access_key() {
          printf 'clipline'
          head -c 16 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 20
          printf '\n'
        }
        if [ ! -s /secrets/session_secret ]; then
          random_secret > /secrets/session_secret
        fi
        if [ ! -s /secrets/s3_access_key_id ]; then
          random_access_key > /secrets/s3_access_key_id
        fi
        if [ ! -s /secrets/s3_secret_access_key ]; then
          random_secret > /secrets/s3_secret_access_key
        fi
        if [ ! -s /secrets/minio_root_user ]; then
          # Preserve existing MinIO installations' root identity on upgrade.
          cp /secrets/s3_access_key_id /secrets/minio_root_user
          cp /secrets/s3_secret_access_key /secrets/minio_root_password
          random_access_key > /secrets/s3_access_key_id
          random_secret > /secrets/s3_secret_access_key
        fi
        chmod 0400 /secrets/minio_root_user /secrets/minio_root_password
        chown 10001:10001 /secrets/session_secret /secrets/s3_access_key_id /secrets/s3_secret_access_key
        chmod 0400 /secrets/session_secret /secrets/s3_access_key_id /secrets/s3_secret_access_key
    volumes:
      - clipline_secrets:/secrets

  clipline-cloud:
    image: ${CLIPLINE_IMAGE:-ghcr.io/clipline-cc/clipline-cloud:1.3.7}
    restart: unless-stopped
    depends_on:
      clipline-secrets:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${CLIPLINE_HTTP_PORT:-8080}:8080"
    environment:
      CLIPLINE_PUBLIC_URL: ${CLIPLINE_PUBLIC_URL:-http://localhost:8080}
      CLIPLINE_ADDITIONAL_PUBLIC_URLS: ${CLIPLINE_ADDITIONAL_PUBLIC_URLS:-}
      CLIPLINE_STEAMGRIDDB_API_KEY: ${CLIPLINE_STEAMGRIDDB_API_KEY:-}
      CLIPLINE_ALLOW_INSECURE_PUBLIC_URL: ${CLIPLINE_ALLOW_INSECURE_PUBLIC_URL:-false}
      CLIPLINE_PROCESS_ROLE: ${CLIPLINE_WEB_PROCESS_ROLE:-all}
      CLIPLINE_DATABASE_URL: sqlite:///data/clipline.db
      CLIPLINE_STORAGE_BACKEND: s3
      CLIPLINE_DATA_DIR: /data
      CLIPLINE_S3_ENDPOINT: http://minio:9000
      CLIPLINE_S3_BUCKET: clipline
      CLIPLINE_S3_REGION: us-east-1
      CLIPLINE_S3_ACCESS_KEY_ID_FILE: /run/clipline-secrets/s3_access_key_id
      CLIPLINE_S3_SECRET_ACCESS_KEY_FILE: /run/clipline-secrets/s3_secret_access_key
      CLIPLINE_S3_FORCE_PATH_STYLE: "true"
      CLIPLINE_DIRECT_S3_UPLOADS: ${CLIPLINE_DIRECT_S3_UPLOADS:-false}
      CLIPLINE_BOOTSTRAP_ADMIN_USERNAME: ${CLIPLINE_BOOTSTRAP_ADMIN_USERNAME:-admin}
      CLIPLINE_SESSION_SECRET_FILE: /run/clipline-secrets/session_secret
      CLIPLINE_MAX_UPLOAD_SIZE_BYTES: ${CLIPLINE_MAX_UPLOAD_SIZE_BYTES:-5368709120}
      CLIPLINE_UPLOAD_PART_SIZE_BYTES: ${CLIPLINE_UPLOAD_PART_SIZE_BYTES:-8388608}
      CLIPLINE_SINGLE_PUT_MAX_BYTES: ${CLIPLINE_SINGLE_PUT_MAX_BYTES:-67108864}
      CLIPLINE_UPLOAD_SESSION_TTL_SECONDS: ${CLIPLINE_UPLOAD_SESSION_TTL_SECONDS:-86400}
      CLIPLINE_JOB_CONCURRENCY: ${CLIPLINE_JOB_CONCURRENCY:-4}
      CLIPLINE_MEDIA_TIMEOUT_SECONDS: ${CLIPLINE_MEDIA_TIMEOUT_SECONDS:-30}
      CLIPLINE_ENCODE_TIMEOUT_SECONDS: ${CLIPLINE_ENCODE_TIMEOUT_SECONDS:-1800}
      CLIPLINE_MEDIA_MEMORY_LIMIT_BYTES: ${CLIPLINE_MEDIA_MEMORY_LIMIT_BYTES:-536870912}
      CLIPLINE_ENCODE_MEMORY_LIMIT_BYTES: ${CLIPLINE_ENCODE_MEMORY_LIMIT_BYTES:-2147483648}
      CLIPLINE_VIDEO_OPTIMIZATION: ${CLIPLINE_VIDEO_OPTIMIZATION:-off}
      CLIPLINE_VIDEO_OPTIMIZATION_CRF: ${CLIPLINE_VIDEO_OPTIMIZATION_CRF:-26}
      CLIPLINE_VIDEO_OPTIMIZATION_PRESET: ${CLIPLINE_VIDEO_OPTIMIZATION_PRESET:-veryfast}
      CLIPLINE_VIDEO_OPTIMIZATION_MAX_WIDTH: ${CLIPLINE_VIDEO_OPTIMIZATION_MAX_WIDTH:-0}
      CLIPLINE_VIDEO_OPTIMIZATION_MIN_SAVINGS_PERCENT: ${CLIPLINE_VIDEO_OPTIMIZATION_MIN_SAVINGS_PERCENT:-5}
      CLIPLINE_VIDEO_OPTIMIZATION_KEEP_ORIGINAL: ${CLIPLINE_VIDEO_OPTIMIZATION_KEEP_ORIGINAL:-false}
      CLIPLINE_MAX_ACTIVE_UPLOAD_SESSIONS_PER_USER: ${CLIPLINE_MAX_ACTIVE_UPLOAD_SESSIONS_PER_USER:-16}
      CLIPLINE_PUBLIC_MEDIA_MODE: ${CLIPLINE_PUBLIC_MEDIA_MODE:-proxy}
      CLIPLINE_PUBLIC_READ_URL_TTL_SECONDS: ${CLIPLINE_PUBLIC_READ_URL_TTL_SECONDS:-300}
      CLIPLINE_TRUSTED_PROXY_HOPS: ${CLIPLINE_TRUSTED_PROXY_HOPS:-}
      CLIPLINE_LOG_LEVEL: ${CLIPLINE_LOG_LEVEL:-info}
    volumes:
      - clipline_data:/data
      - clipline_secrets:/run/clipline-secrets:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  clipline-worker:
    profiles: ["worker"]
    image: ${CLIPLINE_IMAGE:-ghcr.io/clipline-cc/clipline-cloud:1.3.7}
    restart: unless-stopped
    depends_on:
      clipline-cloud:
        condition: service_healthy
    environment:
      CLIPLINE_PUBLIC_URL: ${CLIPLINE_PUBLIC_URL:-http://localhost:8080}
      CLIPLINE_ADDITIONAL_PUBLIC_URLS: ${CLIPLINE_ADDITIONAL_PUBLIC_URLS:-}
      CLIPLINE_ALLOW_INSECURE_PUBLIC_URL: ${CLIPLINE_ALLOW_INSECURE_PUBLIC_URL:-false}
      CLIPLINE_PROCESS_ROLE: worker
      CLIPLINE_DATABASE_URL: sqlite:///data/clipline.db
      CLIPLINE_STORAGE_BACKEND: s3
      CLIPLINE_DATA_DIR: /data
      CLIPLINE_S3_ENDPOINT: http://minio:9000
      CLIPLINE_S3_BUCKET: clipline
      CLIPLINE_S3_REGION: us-east-1
      CLIPLINE_S3_ACCESS_KEY_ID_FILE: /run/clipline-secrets/s3_access_key_id
      CLIPLINE_S3_SECRET_ACCESS_KEY_FILE: /run/clipline-secrets/s3_secret_access_key
      CLIPLINE_S3_FORCE_PATH_STYLE: "true"
      CLIPLINE_DIRECT_S3_UPLOADS: ${CLIPLINE_DIRECT_S3_UPLOADS:-false}
      CLIPLINE_BOOTSTRAP_ADMIN_USERNAME: ${CLIPLINE_BOOTSTRAP_ADMIN_USERNAME:-admin}
      CLIPLINE_SESSION_SECRET_FILE: /run/clipline-secrets/session_secret
      CLIPLINE_MAX_UPLOAD_SIZE_BYTES: ${CLIPLINE_MAX_UPLOAD_SIZE_BYTES:-5368709120}
      CLIPLINE_UPLOAD_PART_SIZE_BYTES: ${CLIPLINE_UPLOAD_PART_SIZE_BYTES:-8388608}
      CLIPLINE_SINGLE_PUT_MAX_BYTES: ${CLIPLINE_SINGLE_PUT_MAX_BYTES:-67108864}
      CLIPLINE_UPLOAD_SESSION_TTL_SECONDS: ${CLIPLINE_UPLOAD_SESSION_TTL_SECONDS:-86400}
      CLIPLINE_JOB_CONCURRENCY: ${CLIPLINE_JOB_CONCURRENCY:-4}
      CLIPLINE_MEDIA_TIMEOUT_SECONDS: ${CLIPLINE_MEDIA_TIMEOUT_SECONDS:-30}
      CLIPLINE_ENCODE_TIMEOUT_SECONDS: ${CLIPLINE_ENCODE_TIMEOUT_SECONDS:-1800}
      CLIPLINE_MEDIA_MEMORY_LIMIT_BYTES: ${CLIPLINE_MEDIA_MEMORY_LIMIT_BYTES:-536870912}
      CLIPLINE_ENCODE_MEMORY_LIMIT_BYTES: ${CLIPLINE_ENCODE_MEMORY_LIMIT_BYTES:-2147483648}
      CLIPLINE_VIDEO_OPTIMIZATION: ${CLIPLINE_VIDEO_OPTIMIZATION:-off}
      CLIPLINE_VIDEO_OPTIMIZATION_CRF: ${CLIPLINE_VIDEO_OPTIMIZATION_CRF:-26}
      CLIPLINE_VIDEO_OPTIMIZATION_PRESET: ${CLIPLINE_VIDEO_OPTIMIZATION_PRESET:-veryfast}
      CLIPLINE_VIDEO_OPTIMIZATION_MAX_WIDTH: ${CLIPLINE_VIDEO_OPTIMIZATION_MAX_WIDTH:-0}
      CLIPLINE_VIDEO_OPTIMIZATION_MIN_SAVINGS_PERCENT: ${CLIPLINE_VIDEO_OPTIMIZATION_MIN_SAVINGS_PERCENT:-5}
      CLIPLINE_VIDEO_OPTIMIZATION_KEEP_ORIGINAL: ${CLIPLINE_VIDEO_OPTIMIZATION_KEEP_ORIGINAL:-false}
      CLIPLINE_MAX_ACTIVE_UPLOAD_SESSIONS_PER_USER: ${CLIPLINE_MAX_ACTIVE_UPLOAD_SESSIONS_PER_USER:-16}
      CLIPLINE_PUBLIC_MEDIA_MODE: ${CLIPLINE_PUBLIC_MEDIA_MODE:-proxy}
      CLIPLINE_PUBLIC_READ_URL_TTL_SECONDS: ${CLIPLINE_PUBLIC_READ_URL_TTL_SECONDS:-300}
      CLIPLINE_TRUSTED_PROXY_HOPS: ${CLIPLINE_TRUSTED_PROXY_HOPS:-}
      CLIPLINE_LOG_LEVEL: ${CLIPLINE_LOG_LEVEL:-info}
    volumes:
      - clipline_data:/data
      - clipline_secrets:/run/clipline-secrets:ro

  minio:
    image: clipline-minio:local
    build:
      context: ./minio
      target: minio
    pull_policy: build
    restart: unless-stopped
    depends_on:
      clipline-secrets:
        condition: service_completed_successfully
    entrypoint:
      - /bin/sh
      - -c
      - |
        read -r MINIO_ROOT_USER < /run/clipline-secrets/minio_root_user
        read -r MINIO_ROOT_PASSWORD < /run/clipline-secrets/minio_root_password
        export MINIO_ROOT_USER MINIO_ROOT_PASSWORD
        exec minio server /data --console-address :9001
    # Local S3 test only; bind MinIO to localhost instead of all host interfaces.
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
      - clipline_secrets:/run/clipline-secrets:ro

  minio-init:
    image: clipline-minio-mc:local
    build:
      context: ./minio
      target: mc
    pull_policy: build
    depends_on:
      clipline-secrets:
        condition: service_completed_successfully
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - |
        ACCESS_KEY="$$(cat /run/clipline-secrets/minio_root_user)"
        SECRET_KEY="$$(cat /run/clipline-secrets/minio_root_password)"
        until mc alias set local http://minio:9000 "$${ACCESS_KEY}" "$${SECRET_KEY}"; do
          sleep 2
        done
        mc mb --ignore-existing local/clipline
        mc anonymous set none local/clipline
        APP_KEY="$$(cat /run/clipline-secrets/s3_access_key_id)"
        APP_SECRET="$$(cat /run/clipline-secrets/s3_secret_access_key)"
        mc admin user add local "$${APP_KEY}" "$${APP_SECRET}"
        cat > /tmp/clipline-policy.json <<'POLICY'
        {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetBucketLocation","s3:ListBucket","s3:ListBucketMultipartUploads"],"Resource":["arn:aws:s3:::clipline"]},{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject","s3:AbortMultipartUpload","s3:ListMultipartUploadParts"],"Resource":["arn:aws:s3:::clipline/*"]}]}
        POLICY
        mc admin policy create local clipline-app /tmp/clipline-policy.json
        mc admin policy attach local clipline-app --user "$${APP_KEY}"
    restart: "no"
    volumes:
      - clipline_secrets:/run/clipline-secrets:ro

volumes:
  clipline_data:
  clipline_secrets:
  minio_data:
